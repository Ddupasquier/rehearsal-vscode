name: Platform compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: Adapter runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Select documentation or full verification
        id: scope
        env:
          REHEARSAL_VERIFY_EVENT: ${{ github.event_name }}
          REHEARSAL_VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REHEARSAL_VERIFY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verification/change-scope.cjs
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run build
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run verify:controller
      - if: steps.scope.outputs.docs_only != 'true'
        run: >-
          npm test --
          tests/runtime/transport/platform_runtime.test.ts
          tests/updates/automatic/automatic_update_settings.test.ts
          tests/updates/identity/extension_identity.test.ts
          tests/updates/automatic/extension_update_reservation.test.ts
          tests/updates/automatic/extension_auto_update.test.ts
          tests/updates/automatic/automatic_update_scheduler.test.ts
          tests/updates/advisory/update_advisory_host.test.ts
      - name: Real POSIX process lifecycle tests
        if: steps.scope.outputs.docs_only != 'true' && runner.os != 'Windows'
        run: npm test -- tests/runtime/transport/process_adapter.test.ts
      - name: Compiled adapter runtime and safe Windows refusal
        if: steps.scope.outputs.docs_only != 'true'
        run: node --import tsx scripts/verification/verify-platform-runtime.ts
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outcome == 'success' && steps.scope.outputs.docs_only != 'true'
        with:
          name: adapter-runtime-${{ matrix.os }}
          path: test-results/platform/*.json
          if-no-files-found: error
          retention-days: 7

# Compiled-controller/Node adapter evidence is not a native VS Code or database
# walkthrough. Existing protected checks and publication controls are unchanged.
