name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Select documentation or full verification
        id: scope
        env:
          REHEARSAL_VERIFY_EVENT: ${{ github.event_name }}
          REHEARSAL_VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REHEARSAL_VERIFY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verification/change-scope.cjs
      - if: steps.scope.outputs.docs_only != 'true' || matrix.node == 24
        run: npm ci --ignore-scripts
      - name: Verify documentation once on Node 24
        if: steps.scope.outputs.docs_only == 'true' && matrix.node == 24
        run: npm run docs:check
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run check
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm audit --audit-level=high

  commercial-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Select documentation or full verification
        id: scope
        env:
          REHEARSAL_VERIFY_EVENT: ${{ github.event_name }}
          REHEARSAL_VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REHEARSAL_VERIFY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verification/change-scope.cjs
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run commercial:verify
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run package:vsix -- --out rehearsal.vsix
